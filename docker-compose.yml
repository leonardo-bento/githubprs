services:
  githubprs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    container_name: githubprs-app
    
  # Optional: Add a development service for hot reloading
  githubprs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: npm run dev
    profiles:
      - dev
    container_name: githubprs-dev 

volumes:
  pr-data:
